<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>APEX LABS // E-MOTO ARCHITECTURE HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {} } };
</script>
<style>
/* ============================================================
   APEX LABS — E-MOTO ARCHITECTURE HUD
   Design tokens
   ============================================================ */
:root{
  --void:        #0A0A0C;
  --tier1:       #111115;
  --tier2:       #18181F;
  --tier3:       #22222B;
  --cyan:        #00F0FF;
  --cyan-dim:    #00A7B4;
  --metal:       #A1A1AA;
  --kinetic:     #2563EB;
  --amber:       #FFB800;
  --alert:       #FF334B;
  --hair:        rgba(255,255,255,.08);
  --hair-strong: rgba(255,255,255,.16);
  --glow:        0 0 20px rgba(0,240,255,.10);
  --glow-hard:   0 0 12px rgba(0,240,255,.55);
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
  --display: 'Space Grotesk', var(--sans);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
body{
  background:var(--void);
  color:#E7E9EA;
  font-family:var(--sans);
  font-size:13px;
  line-height:18px;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{ font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; }
button:focus-visible, [tabindex]:focus-visible{
  outline:1px solid var(--cyan);
  outline-offset:2px;
}
::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:rgba(0,240,255,.25); }

/* ---------- Typography helpers ---------- */
.mono{ font-family:var(--mono); }
.lbl{ font-family:var(--mono); font-size:10px; line-height:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--metal); }
.lbl-c{ color:var(--cyan); }
.val{ font-family:var(--mono); font-size:13px; letter-spacing:-.01em; color:#fff; }
.display{ font-family:var(--display); letter-spacing:-.03em; text-transform:uppercase; font-weight:700; }

/* ---------- App shell ---------- */
#app{ display:flex; flex-direction:column; height:100%; width:100%; }

/* ---------- Top bar ---------- */
.topbar{
  flex:0 0 auto;
  height:54px;
  display:flex; align-items:center; gap:18px;
  padding:0 16px;
  background:rgba(17,17,21,.9);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--hair);
  z-index:60;
}
.brand{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.brand-mark{
  width:26px; height:26px; position:relative;
  border:1px solid var(--cyan); transform:rotate(45deg);
  box-shadow:inset 0 0 8px rgba(0,240,255,.35);
}
.brand-mark::after{
  content:''; position:absolute; inset:6px; background:var(--cyan); opacity:.85;
}
.brand-name{ font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.06em; }
.brand-name span{ color:var(--cyan); }

.nav{ display:flex; align-items:center; gap:2px; margin-left:8px; }
.nav-btn{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--metal); padding:7px 12px; border:1px solid transparent; border-radius:2px;
  transition:color .18s, background .18s, border-color .18s;
  white-space:nowrap;
}
.nav-btn:hover{ color:#fff; background:rgba(255,255,255,.04); }
.nav-btn[aria-selected="true"]{
  color:var(--cyan); border-color:rgba(0,240,255,.35);
  background:rgba(0,240,255,.07); box-shadow:var(--glow);
}
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:14px; }
.pulse{ width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:var(--glow-hard); animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }

/* ---------- Telemetry strip ---------- */
.telemetry{
  flex:0 0 auto;
  display:flex; align-items:stretch; gap:0;
  height:34px;
  background:var(--tier1);
  border-bottom:1px solid var(--hair);
  overflow-x:auto; scrollbar-width:none;
  z-index:55;
}
.telemetry::-webkit-scrollbar{ display:none; }
.tcell{
  display:flex; align-items:center; gap:7px;
  padding:0 14px; white-space:nowrap;
  border-right:1px solid var(--hair);
}
.tcell .k{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:#6C7076; text-transform:uppercase; }
.tcell .v{ font-family:var(--mono); font-size:11px; font-weight:600; color:var(--cyan); }
.tcell .v.neutral{ color:#D6D9DC; }
.tcell.push{ margin-left:auto; border-right:none; border-left:1px solid var(--hair); }

/* ---------- Views ---------- */
main{ flex:1 1 auto; position:relative; min-height:0; }
.view{ position:absolute; inset:0; display:none; }
.view.active{ display:block; }
.scroll{ position:absolute; inset:0; overflow-y:auto; }

/* ============================================================
   HOME
   ============================================================ */
.home-wrap{ max-width:1180px; margin:0 auto; padding:34px 24px 80px; position:relative; }
.home-glow{
  position:absolute; top:-160px; left:50%; transform:translateX(-50%);
  width:820px; height:340px; pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(0,240,255,.13), transparent 70%);
  filter:blur(30px);
}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  padding:4px 10px; background:var(--tier2); border-left:1px solid var(--cyan);
  font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#CFD3D6;
}
.hero-title{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:clamp(34px, 6.4vw, 66px); line-height:.94; letter-spacing:-.035em;
  margin:20px 0 0;
}
.hero-title em{ font-style:normal; color:var(--cyan); text-shadow:0 0 28px rgba(0,240,255,.35); }
.hero-sub{ max-width:56ch; color:#9BA1A7; margin-top:16px; font-size:14px; line-height:22px; }
.hero-actions{ display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; }
.btn-primary{
  display:inline-flex; align-items:center; gap:14px;
  background:var(--cyan); color:#04191C; padding:13px 20px; border-radius:2px;
  font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  transition:background .2s, box-shadow .2s, transform .2s;
}
.btn-primary:hover{ background:#fff; box-shadow:0 0 22px rgba(0,240,255,.45); }
.btn-primary:active{ transform:translateY(1px); }
.btn-ghost{
  display:inline-flex; align-items:center; gap:10px;
  border:1px solid var(--hair-strong); padding:13px 18px; border-radius:2px;
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#E7E9EA;
  transition:border-color .2s, background .2s, color .2s;
}
.btn-ghost:hover{ border-color:var(--cyan); color:var(--cyan); background:rgba(0,240,255,.05); }

.spec-strip{
  margin-top:44px; display:grid; gap:1px; background:var(--hair);
  border:1px solid var(--hair); grid-template-columns:repeat(auto-fit, minmax(170px,1fr));
}
.spec-cell{ background:var(--tier1); padding:16px 18px; }
.spec-cell .n{ font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.03em; color:#fff; }
.spec-cell .n u{ text-decoration:none; color:var(--cyan); font-size:15px; margin-left:3px; }
.spec-cell .k{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:#6C7076; text-transform:uppercase; margin-top:6px; }

.home-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin-top:44px; }
.home-card{
  border:1px solid var(--hair); background:var(--tier1); padding:18px; border-radius:2px;
  display:flex; flex-direction:column; gap:10px; text-align:left;
  transition:border-color .2s, background .2s;
}
button.home-card:hover{ border-color:rgba(0,240,255,.4); background:var(--tier2); }
.home-card h3{ font-family:var(--display); font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em; }
.home-card p{ margin:0; color:#8E959B; font-size:13px; line-height:19px; }
.card-index{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--cyan); }

.section-head{ display:flex; align-items:baseline; gap:14px; margin:52px 0 16px; }
.section-head h2{ font-family:var(--display); font-size:22px; font-weight:600; letter-spacing:-.02em; margin:0; text-transform:uppercase; }
.rule{ flex:1; height:1px; background:var(--hair); }

/* ============================================================
   3D EXPLORER STAGE
   ============================================================ */
#stage{ position:absolute; inset:0; overflow:hidden; background:var(--void); }
#gl-host{ position:absolute; inset:0; }
#gl-host canvas{ display:block; width:100%; height:100%; touch-action:none; }

.vignette{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(0,0,0,.65) 100%);
}
.scanline{
  position:absolute; inset:0; pointer-events:none; opacity:.18;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay;
}
/* corner brackets */
.bracket{ position:absolute; width:22px; height:22px; border:1px solid rgba(0,240,255,.45); pointer-events:none; }
.bracket.tl{ top:16px; left:16px; border-right:none; border-bottom:none; }
.bracket.tr{ top:16px; right:16px; border-left:none; border-bottom:none; }
.bracket.bl{ bottom:16px; left:16px; border-right:none; border-top:none; }
.bracket.br{ bottom:16px; right:16px; border-left:none; border-top:none; }

/* Center crosshair */
.crosshair{ position:absolute; top:50%; left:50%; width:40px; height:40px; transform:translate(-50%,-50%); pointer-events:none; opacity:.5; }
.crosshair::before,.crosshair::after{ content:''; position:absolute; background:rgba(0,240,255,.5); }
.crosshair::before{ left:50%; top:0; width:1px; height:100%; }
.crosshair::after{ top:50%; left:0; height:1px; width:100%; }

/* ---------- Left tool rail ---------- */
.rail{
  position:absolute; top:16px; left:52px; display:flex; flex-direction:column; gap:6px; z-index:20;
}
.tool{
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--hair); background:rgba(17,17,21,.86); backdrop-filter:blur(12px);
  color:var(--metal); border-radius:2px; transition:.18s;
}
.tool:hover{ color:#fff; border-color:var(--hair-strong); }
.tool[aria-pressed="true"]{ color:var(--cyan); border-color:rgba(0,240,255,.45); background:rgba(0,240,255,.08); box-shadow:var(--glow); }
.tool svg{ width:18px; height:18px; }
.tool-tip{
  position:absolute; left:48px; top:50%; transform:translateY(-50%) translateX(-4px);
  background:var(--tier2); border:1px solid var(--hair); padding:4px 8px;
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap;
  opacity:0; pointer-events:none; transition:.18s;
}
.tool-wrap{ position:relative; display:flex; }
.tool-wrap:hover .tool-tip{ opacity:1; transform:translateY(-50%) translateX(0); }

/* ---------- Top-left gizmo readout ---------- */
.gizmo{
  position:absolute; top:16px; left:110px; z-index:18;
  display:flex; align-items:center; gap:12px;
  background:rgba(17,17,21,.86); backdrop-filter:blur(14px);
  border:1px solid var(--hair); padding:9px 14px; border-radius:2px;
}
.gizmo .axis{ display:flex; flex-direction:column; gap:2px; }
.gizmo .axis span{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:#8E959B; }
.gizmo .axis b{ color:var(--cyan); font-weight:600; }

/* ---------- Top-right render cam ---------- */
.rendercam{
  position:absolute; top:16px; right:16px; z-index:18; text-align:right;
  background:rgba(17,17,21,.86); backdrop-filter:blur(14px);
  border:1px solid var(--hair); padding:10px 16px; border-radius:2px; min-width:250px;
}
.rendercam .big{ font-family:var(--mono); font-size:21px; font-weight:600; letter-spacing:-.02em; color:#fff; }
.rendercam .big b{ color:var(--cyan); font-weight:600; }
.rendercam .row{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:#7A8188; text-transform:uppercase; margin-top:5px; }

/* ---------- Hotspots ---------- */
#hotspots{ position:absolute; inset:0; pointer-events:none; z-index:15; }
.hotspot{
  position:absolute; transform:translate(-50%,-50%); pointer-events:auto;
  display:flex; align-items:center; gap:0; will-change:transform, opacity;
  transition:opacity .25s;
}
.hs-node{
  position:relative; width:14px; height:14px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
}
.hs-node::before{
  content:''; position:absolute; inset:4px; background:var(--cyan); border-radius:50%;
  box-shadow:var(--glow-hard);
}
.hs-node::after{
  content:''; position:absolute; inset:0; border:1px solid rgba(0,240,255,.6); border-radius:50%;
  animation:ring 2.6s ease-out infinite;
}
@keyframes ring{ 0%{ transform:scale(.7); opacity:.9 } 100%{ transform:scale(2.1); opacity:0 } }
.hs-line{ height:1px; width:30px; background:linear-gradient(to right, rgba(0,240,255,.9), rgba(0,240,255,.3)); }
.hs-card{
  background:rgba(24,24,31,.82); backdrop-filter:blur(18px);
  border:1px solid rgba(0,240,255,.28); border-left:2px solid var(--cyan);
  padding:6px 10px; text-align:left; border-radius:2px;
  box-shadow:var(--glow); transition:.2s; white-space:nowrap;
}
.hs-card:hover{ border-color:var(--cyan); background:rgba(0,240,255,.12); }
.hs-card .t{ font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.12em; color:var(--cyan); text-transform:uppercase; }
.hs-card .s{ font-family:var(--mono); font-size:10px; letter-spacing:.04em; color:#B7BDC2; }
.hotspot.is-active .hs-card{ background:rgba(0,240,255,.16); border-color:var(--cyan); }
.hotspot.flip{ flex-direction:row-reverse; }
.hotspot.flip .hs-card{ border-left:1px solid rgba(0,240,255,.28); border-
    right:2px solid var(--cyan); text-align:right; }
.hotspot.hidden{ opacity:0; pointer-events:none; }

/* ---------- Inspector ---------- */
.inspector{
  position:absolute; top:70px; right:16px; bottom:96px; width:336px; z-index:22;
  background:rgba(17,17,21,.9); backdrop-filter:blur(22px);
  border:1px solid rgba(0,240,255,.2); border-radius:2px;
  box-shadow:var(--glow); display:flex; flex-direction:column;
  transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .3s;
}
.inspector.collapsed{ transform:translateX(calc(100% + 24px)); opacity:0; pointer-events:none; }
.insp-head{ padding:14px 16px; border-bottom:1px solid var(--hair); display:flex; align-items:flex-start; gap:10px; }
.insp-head .idx{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--cyan); }
.insp-head h2{ font-family:var(--display); font-size:19px; font-weight:600; margin:4px 0 2px; letter-spacing:-.01em; text-transform:uppercase; }
.insp-head p{ margin:0; font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:#7A8188; }
.insp-close{ margin-left:auto; color:#7A8188; font-family:var(--mono); font-size:14px; padding:2px 6px; }
.insp-close:hover{ color:var(--cyan); }
.insp-body{ overflow-y:auto; padding:14px 16px 18px; flex:1; }
.insp-desc{ color:#9BA1A7; font-size:12.5px; line-height:19px; margin:0 0 16px; }
.gauges{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--hair); border:1px solid var(--hair); margin-bottom:16px; }
.gauge{ background:var(--tier2); padding:10px 12px; }
.gauge .k{ font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:#6C7076; text-transform:uppercase; }
.gauge .v{ font-family:var(--mono); font-size:18px; font-weight:600; color:#fff; letter-spacing:-.02em; margin-top:3px; }
.gauge .v u{ text-decoration:none; font-size:11px; color:var(--cyan); margin-left:2px; }
.bar{ height:2px; background:rgba(255,255,255,.08); margin-top:8px; position:relative; overflow:hidden; }
.bar i{ position:absolute; left:0; top:0; bottom:0; background:var(--cyan); box-shadow:0 0 8px rgba(0,240,255,.6); transition:width .6s cubic-bezier(.4,0,.2,1); }
.bar i.warn{ background:var(--amber); box-shadow:0 0 8px rgba(255,184,0,.5); }
.rows{ display:flex; flex-direction:column; }
.row{
  display:flex; align-items:baseline; gap:8px; padding:7px 0;
  border-bottom:1px dotted rgba(255,255,255,.1);
}
.row .k{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:#7A8188; text-transform:uppercase; }
.row .dots{ flex:1; border-bottom:1px dotted rgba(255,255,255,.14); transform:translateY(-3px); }
.row .v{ font-family:var(--mono); font-size:11px; color:#E7E9EA; text-align:right; }
.tagline{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.tag{ font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:#B7BDC2; border:1px solid var(--hair); padding:3px 7px; }
.tag.on{ color:var(--cyan); border-color:rgba(0,240,255,.4); }

/* ---------- Bottom dock ---------- */
.dock{
  position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:24;
  display:flex; flex-direction:column; align-items:center; gap:8px; width:min(96vw, 900px);
}
.dock-row{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;
  background:rgba(17,17,21,.88); backdrop-filter:blur(16px);
  border:1px solid var(--hair); padding:6px; border-radius:2px;
}
.chip{
  display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  padding:7px 12px; border:1px solid transparent; border-radius:2px; transition:.18s; min-width:104px;
}
.chip .t{ font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#D6D9DC; }
.chip .s{ font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:#6C7076; }
.chip:hover{ background:rgba(255,255,255,.05); border-color:var(--hair); }
.chip[aria-pressed="true"]{ background:rgba(0,240,255,.1); border-color:rgba(0,240,255,.45); box-shadow:var(--glow); }
.chip[aria-pressed="true"] .t{ color:var(--cyan); }
.seg{ display:flex; gap:2px; background:rgba(17,17,21,.88); backdrop-filter:blur(16px); border:1px solid var(--hair); padding:4px; border-radius:2px; }
.seg button{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  padding:7px 14px; color:var(--metal); border-radius:2px; transition:.18s;
}
.seg button:hover{ color:#fff; background:rgba(255,255,255,.05); }
.seg button[aria-pressed="true"]{ background:var(--cyan); color:#04191C; font-weight:700; }

/* ---------- Loader ---------- */
.loader{
  position:absolute; inset:0; z-index:80; background:var(--void);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  transition:opacity .6s; 
}
.loader.gone{ opacity:0; pointer-events:none; }
.loader .bar{ width:220px; height:2px; background:rgba(255,255,255,.1); }
.loader .bar i{ width:0%; }
.loader .t{ font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--cyan); text-transform:uppercase; }

/* ============================================================
   PART DETAILS
   ============================================================ */
.parts-wrap{ max-width:1180px; margin:0 auto; padding:30px 24px 80px; }
.part-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:14px; }
.part-card{
  border:1px solid var(--hair); background:var(--tier1); border-radius:2px; overflow:hidden;
  display:flex; flex-direction:column;
}
.part-card header{ padding:16px 18px; border-bottom:1px solid var(--hair); display:flex; gap:12px; align-items:flex-start; }
.part-card header .idx{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--cyan); }
.part-card h3{ font-family:var(--display); font-size:18px; font-weight:600; margin:4px 0 0; text-transform:uppercase; letter-spacing:-.01em; }
.part-card header p{ margin:3px 0 0; font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:#7A8188; }
.part-card .body{ padding:16px 18px; display:flex; flex-direction:column; gap:14px; flex:1; }
.part-card .body > p{ margin:0; color:#9BA1A7; font-size:12.5px; line-height:19px; }
.part-card footer{ padding:12px 18px 16px; }
.heat-scale{ display:flex; height:4px; }
.heat-scale i{ flex:1; }

/* ============================================================
